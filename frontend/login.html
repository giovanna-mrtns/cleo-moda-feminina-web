<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Cleo</title>
    <link rel="stylesheet" href="style2.css">
    <style>
        /* Toast de notificação */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #2e7d32;
            color: #fff;
            padding: 14px 28px;
            border-radius: 8px;
            font-family: Jost, sans-serif;
            font-size: 15px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 9999;
            white-space: nowrap;
        }
        .toast.visivel {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.erro {
            background: #c62828;
        }
    </style>
</head>
<body>

<div id="toast" class="toast"></div>

<header class="topo">
   <div id="header">
        <div id="logo">
            <a href="index.html">
                <img src="imgs/Logo-cleo.png" alt="Logo Cleo" width="100px">
            </a>
        </div>
        <div class="barra-pesquisa">
            <input type="text" placeholder="Buscar produtos...">
            <img src="imgs/icone-loupe-gris 6.png" alt="Buscar" width="30px">
        </div>
        <div class="icones-header">
            <div class="icone-conta">
                <img src="imgs/logo-mulher-minha conta.png" alt="Minha Conta" width="35px">
                <div class="info-conta">
                    <a href="login.html" class="email-usuario">Fazer Login</a>
                </div>
            </div>
            <div class="icone-carrinho">
                <img src="imgs/carrinho 1.png" alt="Carrinho" width="35px">
                <a href="Carrinho.html" class="email-usuario">Carrinho</a>
            </div>
        </div>
   </div>
</header>

<nav class="menu">
    <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="#">Lançamentos</a></li>
        <li><a href="#">Roupas</a></li>
        <li><a href="#">Acessórios</a></li>
        <li><a href="#">Promoções</a></li>
    </ul>
</nav>

<div class="banner">
    <img src="imgs/lado-esquerdo.png" alt="Modelo Esquerda" class="banner-esquerda">
    <div class="banner-centro">
        <h2>Seu estilo único aqui!</h2>
        <div class="frete">
            <img src="imgs/Coracao (2).png" alt="coração" width="25px">
            <span>Frete Grátis em todo o Brasil</span>
            <img src="imgs/Coracao (2).png" alt="coração" width="25px">
        </div>
    </div>
    <img src="imgs/lado-direito.png" alt="Modelo Direita" class="banner-direita">
</div>

<div class="login-container">
    <h2>ACESSE COM LOGIN OU CADASTRE-SE!</h2>
    <form action="#" method="post" class="login-form">
        <label for="login">Email:</label>
        <input type="email" id="login" name="login" required>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required>

        <button type="submit" class="logar">Entrar</button>
        <button type="button" class="registrar" onclick="location.href='cadastro.html'">Quero criar uma conta</button>
    </form>
    <p><a href="#" class="esqueceu-senha">Esqueci minha senha</a></p>
</div>

<script src="carrinho.js"></script>
<script>
    // Se já estiver logado, redireciona direto para o início
    if (getAuth()) {
        window.location.href = 'index.html';
    }

    function mostrarToast(msg, erro = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.toggle('erro', erro);
        toast.classList.add('visivel');
        setTimeout(() => toast.classList.remove('visivel'), 3500);
    }

    document.addEventListener('DOMContentLoaded', function () {
        // Mostra mensagem de cadastro bem-sucedido se vier do cadastro
        if (sessionStorage.getItem('contaCriada')) {
            sessionStorage.removeItem('contaCriada');
            mostrarToast('✓ Você criou sua conta! Faça seu login.');
        }

        document.querySelector('.logar').addEventListener('submit', async function (e) {
            e.preventDefault();
            const login = document.getElementById('login').value;
            const senha = document.getElementById('senha').value;

            if (!login || !senha) {
                mostrarToast('Preencha o e-mail e a senha.', true);
                return;
            }

            try {
                const resp = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, senha })
                });

                if (resp.ok) {
                    const dados = await resp.json();
                    // dados = { token, id, nome, login, nomePerfil }
                    salvarAuth(dados);
                    // Sinaliza para o index mostrar o toast de boas-vindas
                    sessionStorage.setItem('loginFeito', dados.nome);
                    window.location.href = 'index.html';
                } else {
                    mostrarToast('E-mail ou senha incorretos.', true);
                }
            } catch (e) {
                mostrarToast('Erro ao conectar ao servidor.', true);
            }
        });
    });
</script>

</body>
</html>
