<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuração de Login</title>
    <link rel="stylesheet" href="style2.css">
</head>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelector('.logar').addEventListener('click', async function(e) {
      e.preventDefault();
      const login = document.getElementById('login').value;
      const senha = document.getElementById('senha').value;

      const resp = await fetch('http://localhost:8080/api/usuarios/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login, senha })
      });

      if (resp.ok) {
        const usuario = await resp.json();
        localStorage.setItem('usuario', JSON.stringify(usuario));
        alert('Bem-vindo, ' + usuario.nome + '!');
        window.location.href = 'index.html';
      } else {
        alert('Login ou senha incorretos.');
      }
    });
  });
</script>

<body>
<header class="topo">

                <img src="imgs/Logo-cleo.png" alt="Logo Cleo" width="100px">

        <div class="icone-carrinho">
            <img src="imgs/carrinho 1.png" alt="Carrinho" width="35px">
            <span>Carrinho</span>

    </div>

   </div>
</header>
<nav class="menu">

<div class="login-container">

        <label for="login">Email:</label>
