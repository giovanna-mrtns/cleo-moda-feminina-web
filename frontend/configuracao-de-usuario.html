<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuração de Usuários – Cleo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div id="header-2">
        <div id="logo">
            <a href="index.html">
                <img src="imgs/Logo-cleo.png" alt="Logo Cleo" width="100px">
            </a>
        </div>
    </div>
</header>

<div class="corpo-config">

    <!-- Menu lateral -->
    <div class="menu-config">
        <h2>MENU</h2>
        <hr>
        <button class="btn-menu ativo" onclick="location.href='configuracao-de-usuario.html'">Configuração de Usuários</button>
        <button class="btn-menu"       onclick="location.href='configuracao-de-modulos.html'">Configuração de Módulos</button>
        <button class="btn-menu"       onclick="location.href='configuracao-de-perfil.html'">Configuração de Perfil</button>
    </div>

    <!-- Conteúdo principal -->
    <div class="config">

        <div class="config-topo">
            <h2>Configuração de Usuários</h2>
            <button id="btn-novo" onclick="abrirModal()">+ Novo Usuário</button>
        </div>

        <div class="config-meio">
            <div class="input-buscar">
                <input id="buscar-usuario" type="text" placeholder="Buscar usuário..." oninput="filtrarTabela()">
                <button class="buscar" type="button">Buscar</button>
            </div>
            <button class="btn-config" onclick="editarSelecionado()">Editar</button>
            <button class="btn-config" onclick="desativarSelecionado()">Desativar</button>
        </div>

        <div class="config-tabela">
            <hr>
            <table class="tabela-usuarios" id="tabela-usuarios">
                <thead>
                    <tr>
                        <th></th>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Login</th>
                        <th>Perfil</th>
                        <th>Situação</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela">
                    <!-- Linhas carregadas pelo JavaScript -->
                </tbody>
            </table>
        </div>

    </div>
</div>

<!-- Modal de cadastro / edição -->
<div id="modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal">
        <h3 id="modal-titulo">Novo Usuário</h3>
        <hr style="margin-bottom:16px">

        <input type="hidden" id="campo-id">

        <label>Nome</label>
        <input type="text" id="campo-nome" placeholder="Nome completo">

        <label>Login</label>
        <input type="text" id="campo-login" placeholder="Login">

        <label>Senha</label>
        <input type="password" id="campo-senha" placeholder="Senha">

        <label>Perfil</label>
        <!-- CORRIGIDO: select populado dinamicamente pela API -->
        <select id="campo-perfil"></select>

        <div class="modal-botoes">
            <button class="btn-config" onclick="fecharModal()">Cancelar</button>
            <button onclick="salvarUsuario()">Salvar</button>
        </div>
    </div>
</div>

<script>
    const API = 'https://cleo-modas-femininas.onrender.com';
    let usuarios = [];
    let linhaSelecionada = null;

    // CORRIGIDO: carrega usuários reais do banco via API
    async function carregarUsuarios() {
        try {
            const resp = await fetch(`${API}/api/usuarios`);
            usuarios = await resp.json();
            renderTabela(usuarios);
        } catch (e) {
            alert('Erro ao conectar ao servidor. Verifique se o backend está rodando.');
        }
    }

    // CORRIGIDO: carrega perfis reais do banco para o select do modal
    async function carregarPerfisNoSelect() {
        try {
            const resp = await fetch(`${API}/api/perfis`);
            const perfis = await resp.json();
            const select = document.getElementById('campo-perfil');
            select.innerHTML = perfis
                .map(p => `<option value="${p.id}">${p.nome}</option>`)
                .join('');
        } catch (e) {
            console.error('Erro ao carregar perfis:', e);
        }
    }

    function renderTabela(lista) {
        const tbody = document.getElementById('corpo-tabela');
        tbody.innerHTML = '';
        lista.forEach(u => {
            const tr = document.createElement('tr');
            tr.dataset.id = u.id;
            tr.innerHTML = `
                <td><input type="radio" name="sel-usuario" onchange="selecionarLinha(${u.id})"></td>
                <td>${u.id}</td>
                <td>${u.nome}</td>
                <td>${u.login}</td>
                <td>${u.nomePerfil || '—'}</td>
                <td class="${u.ativo === 's' ? 'ativo-status' : 'inativo-status'}">
                    ${u.ativo === 's' ? 'Ativo' : 'Inativo'}
                </td>`;
            tbody.appendChild(tr);
        });
    }

    function filtrarTabela() {
        const termo = document.getElementById('buscar-usuario').value.toLowerCase();
        const filtrados = usuarios.filter(u =>
            u.nome.toLowerCase().includes(termo) ||
            u.login.toLowerCase().includes(termo)
        );
        renderTabela(filtrados);
    }

    function selecionarLinha(id) {
        linhaSelecionada = id;
    }

    function abrirModal(usuario = null) {
        document.getElementById('modal-titulo').textContent = usuario ? 'Editar Usuário' : 'Novo Usuário';
        document.getElementById('campo-id').value    = usuario ? usuario.id    : '';
        document.getElementById('campo-nome').value  = usuario ? usuario.nome  : '';
        document.getElementById('campo-login').value = usuario ? usuario.login : '';
        document.getElementById('campo-senha').value = '';
        if (usuario) document.getElementById('campo-perfil').value = usuario.idPerfil;
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function fecharModal() {
        document.getElementById('modal-overlay').style.display = 'none';
    }

    // CORRIGIDO: salva via API real (POST para criar, PUT para editar)
    async function salvarUsuario() {
        const id       = document.getElementById('campo-id').value;
        const nome     = document.getElementById('campo-nome').value.trim();
        const login    = document.getElementById('campo-login').value.trim();
        const senha    = document.getElementById('campo-senha').value.trim();
        const idPerfil = parseInt(document.getElementById('campo-perfil').value);

        if (!nome || !login || !senha) {
            alert('Nome, login e senha são obrigatórios.');
            return;
        }

        const body = { nome, login, senha, idPerfil };

        if (id) {
            await fetch(`${API}/api/usuarios`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: parseInt(id), ...body })
            });
        } else {
            await fetch(`${API}/api/usuarios`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
        }

        fecharModal();
        carregarUsuarios();
    }

    function editarSelecionado() {
        if (!linhaSelecionada) { alert('Selecione um usuário.'); return; }
        const u = usuarios.find(u => u.id === linhaSelecionada);
        abrirModal(u);
    }

    // CORRIGIDO: desativa via API real (DELETE)
    async function desativarSelecionado() {
        if (!linhaSelecionada) { alert('Selecione um usuário.'); return; }
        if (!confirm('Deseja desativar este usuário?')) return;
        await fetch(`${API}/api/usuarios/${linhaSelecionada}`, { method: 'DELETE' });
        linhaSelecionada = null;
        carregarUsuarios();
    }

    // Inicializa a página
    window.onload = () => {
        carregarPerfisNoSelect();
        carregarUsuarios();
    };
</script>

</body>
</html>
