<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cléo Modas Femininas</title>
    <link rel="stylesheet" href="style2.css">
    <style>
        /* Toast de notificação */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #2e7d32;
            color: #fff;
            padding: 14px 28px;
            border-radius: 8px;
            font-family: Jost, sans-serif;
            font-size: 15px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 9999;
            white-space: nowrap;
        }
        .toast.visivel {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Área de conta quando logado */
        .info-conta {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .nome-usuario {
            font-family: Jost, sans-serif;
            font-weight: bold;
            color: #fff;
            font-size: 14px;
            line-height: 1.2;
        }
        .btn-sair {
            background: none;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 4px;
            color: #fff;
            font-family: Jost, sans-serif;
            font-size: 12px;
            padding: 2px 8px;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
        }
        .btn-sair:hover {
            background: rgba(255,255,255,0.15);
        }
    </style>

    <script src="carrinho.js"></script>
    <link rel="stylesheet" href="common.css">
</head>
<body>

<div id="toast" class="toast"></div>

<header class="topo">
   <div id="header">
        <div id="logo">
            <a href="index.html">
                <img src="imgs/Logo-cleo.png" alt="Logo Cleo" width="100px">
            </a>
        </div>
        <div class="barra-pesquisa">
            <input type="text" id="busca-produto" placeholder="Buscar produtos...">
            <img src="imgs/icone-loupe-gris 6.png" alt="Buscar" width="30px">
        </div>
        <div class="icones-header">
            <div class="icone-conta">
                <img src="imgs/logo-mulher-minha conta.png" alt="Minha Conta" width="35px">
                <div class="info-conta" id="info-conta">
                    <a href="login.html" class="email-usuario">Fazer Login</a>
                </div>
            </div>
            <div class="icone-carrinho" style="position: relative;">
                <img src="imgs/carrinho 1.png" alt="Carrinho" width="35px">
                <span id="contador-carrinho" style="
                    position: absolute; top: -6px; right: -6px;
                    background: #851B87; color: #fff; font-size: 11px;
                    font-family: Jost, sans-serif; border-radius: 50%;
                    min-width: 18px; height: 18px; display: none;
                    align-items: center; justify-content: center; text-align: center;
                "></span>
                <a href="carrinho.html" class="email-usuario">Carrinho</a>
            </div>
        </div>
   </div>
</header>

<nav class="menu">
    <ul>
        <li><a href="index.html" class="ativo">Início</a></li>
        <li><a href="#">Lançamentos</a></li>
        <li><a href="#">Roupas</a></li>
        <li><a href="#">Acessórios</a></li>
        <li><a href="#">Promoções</a></li>
    </ul>
</nav>

<div class="banner">
    <img src="imgs/lado-esquerdo.png" alt="Modelo Esquerda" class="banner-esquerda">
    <div class="banner-centro">
        <h2>Seu estilo único aqui!</h2>
        <div class="frete">
            <img src="imgs/Coracao (2).png" alt="coração" width="25px">
            <span>Frete Grátis em todo o Brasil</span>
            <img src="imgs/Coracao (2).png" alt="coração" width="25px">
        </div>
    </div>
    <img src="imgs/lado-direito.png" alt="Modelo Direita" class="banner-direita">
</div>

<section class="produtos">
    <div class="produtos-header">
        <h2>TODOS OS PRODUTOS</h2>
        <select class="ordenar">
            <option>Ordenar por: Mais Recentes</option>
            <option>Ordenar por: Menor Preço</option>
            <option>Ordenar por: Maior Preço</option>
        </select>
    </div>
    <div class="produtos-grid" id="produtos-grid"></div>
</section>

<section class="mais-vendidos">
    <h2>MAIS VENDIDOS</h2>
    <div class="mais-vendidos-grid">
        <div class="mais-vendidos-card">
            <img src="imgs/bolsas.jpg" alt="Bolsas">
            <span>Bolsas</span>
        </div>
        <div class="mais-vendidos-card">
            <img src="imgs/blusas.jpg" alt="Blusas">
            <span>Blusas</span>
        </div>
        <div class="mais-vendidos-card">
            <img src="imgs/vestidos.jpg" alt="Vestidos">
            <span>Vestidos</span>
        </div>
        <div class="mais-vendidos-card">
            <img src="imgs/calças.jpg" alt="Calças">
            <span>Calças</span>
        </div>
    </div>
</section>

<script>
    /* ============================================================
       FUNÇÕES AUXILIARES
       ============================================================ */
    function mostrarToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('visivel');
        setTimeout(() => toast.classList.remove('visivel'), 4000);
    }

    function atualizarHeader() {
        const auth = getAuth();
        const infoConta = document.getElementById('info-conta');
        if (auth) {
            const primeiroNome = auth.nome.split(' ')[0];
            infoConta.innerHTML = `
                <a href="perfil-usuario.html" class="nome-usuario" style="text-decoration:none;">Olá, ${primeiroNome}</a>
                <button class="btn-sair" onclick="logout()">Sair</button>
            `;
        } else {
            infoConta.innerHTML = `<a href="login.html" class="email-usuario">Fazer Login</a>`;
        }
    }

    let todosProdutos = [];

    async function carregarProdutos() {
        const grid = document.getElementById('produtos-grid');
        grid.innerHTML = '<p style="font-family: Mina;">Carregando produtos...</p>';

        try {
            const resposta = await fetch(`${API_BASE}/produtos`);
            if (!resposta.ok) throw new Error('Falha ao buscar produtos');
            const produtos = await resposta.json();
            todosProdutos = produtos;

            if (produtos.length === 0) {
                grid.innerHTML = '<p style="font-family: Mina;">Nenhum produto cadastrado ainda.</p>';
                return;
            }

            renderizarProdutos(todosProdutos);

        } catch (erro) {
            console.error(erro);
            grid.innerHTML = '<p style="font-family: Mina; color: red;">Erro ao carregar produtos.</p>';
        }
    }

    function renderizarProdutos(lista) {
        const grid = document.getElementById('produtos-grid');
        grid.innerHTML = '';

        if (lista.length === 0) {
            grid.innerHTML = '<p style="font-family: Mina;">Nenhum produto encontrado.</p>';
            return;
        }

        lista.forEach(produto => {
            const card = document.createElement('div');
            card.className = 'produto-card';
            card.style.cursor = 'pointer';

            const imagem = produto.imagemUrl && produto.imagemUrl.trim() !== ''
                ? produto.imagemUrl
                : 'imgs/cropped-liso-branco.jpg';

            card.innerHTML = `
                <img src="${imagem}" alt="${produto.nome}">
                <div class="produto-info">
                    <span>${produto.nome}</span>
                    <span>${formatarPreco(produto.preco)}</span>
                </div>
            `;

            card.addEventListener('click', () => {
                window.location.href = `pagina-produto.html?id=${produto.id}`;
            });

            grid.appendChild(card);
        });
    }

    /* ============================================================
       BARRA DESLIZANTE — definida ANTES do window.onload
       ============================================================ */
    function iniciarBarraDeslizante() {
        const ul = document.querySelector('.menu ul');
        if (!ul) return;
        const links = ul.querySelectorAll('li a');

        const indicator = document.createElement('span');
        indicator.classList.add('nav-indicator');
        ul.appendChild(indicator);

        function moverBarraPara(el) {
            const linkRect = el.getBoundingClientRect();

        indicator.style.left =
        (linkRect.left - ulRect.left) + 'px';

        indicator.style.width =
        linkRect.width + 'px';
        }

        const ativo = ul.querySelector('a.ativo');
        if (ativo) {
            indicator.style.transition = 'none';
            moverBarraPara(ativo);
            setTimeout(() => {
                indicator.style.transition = 'left 0.3s ease, width 0.3s ease';
            }, 100);
        }

        links.forEach(link => {
            link.addEventListener('mouseenter', () => moverBarraPara(link));
        });

        ul.addEventListener('mouseleave', () => {
            const atual = ul.querySelector('a.ativo');
            if (atual) moverBarraPara(atual);
        });
    }

    /* ============================================================
       INICIALIZAÇÃO — window.onload
       ============================================================ */
    window.onload = function () {
        // 1. Atualiza header (login/logout)
        atualizarHeader();

        // 2. Toast de boas-vindas após login
        const nomeLogin = sessionStorage.getItem('loginFeito');
        if (nomeLogin) {
            sessionStorage.removeItem('loginFeito');
            mostrarToast(`✓ Bem-vindo(a), ${nomeLogin.split(' ')[0]}!`);
        }

        // 3. Carrega produtos da API
        carregarProdutos();

        // 4. Busca ao digitar
        const campoBusca = document.getElementById('busca-produto');
        campoBusca.addEventListener('input', () => {
            const texto = campoBusca.value.toLowerCase().trim();
            const filtrados = todosProdutos.filter(produto =>
                produto.nome.toLowerCase().includes(texto) ||
                produto.descricao.toLowerCase().includes(texto) ||
                produto.categoria.toLowerCase().includes(texto)
            );
            renderizarProdutos(filtrados);
        });

        // 5. Busca ao clicar na lupa
        const lupa = document.querySelector('.barra-pesquisa img');
        lupa.style.cursor = 'pointer';
        lupa.addEventListener('click', () => {
            campoBusca.dispatchEvent(new Event('input'));
        });

        // 6. Barra deslizante do menu
        iniciarBarraDeslizante();
    };
</script>

<!-- Barra admin -->
<style>
    .admin-bar { display: none; position: fixed; top: 0; left: 0; right: 0; background: #111; color: #fff; padding: 10px; z-index: 10000; font-family: Arial, sans-serif; }
    .admin-bar a { color: #fff; margin-right: 15px; text-decoration: none; }
    body.admin-visible { padding-top: 45px; }
</style>
<div id="adminBar" class="admin-bar">
    <strong>Painel Administrativo</strong>
    <a href="configuracao-de-usuario.html">Usuários</a>
    <a href="configuracao-de-perfil.html">Perfis</a>
    <a href="configuracao-de-modulos.html">Módulos</a>
</div>
<script>
    (function () {
        try {
            const auth = JSON.parse(localStorage.getItem('auth') || '{}');
            const perfil = (auth.nomePerfil || '').toLowerCase();
            if (perfil.includes('admin')) {
                document.getElementById('adminBar').style.display = 'block';
                document.body.classList.add('admin-visible');
            }
        } catch (e) {}
    })();
</script>

<script src="gerente-sidebar.js"></script>

</body>
</html>
