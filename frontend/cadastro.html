<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se já – Cléo MF</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="style2.css">
    <style>
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #2e7d32;
            color: #fff;
            padding: 14px 28px;
            border-radius: 8px;
            font-family: Jost, sans-serif;
            font-size: 15px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 9999;
            white-space: nowrap;
        }
        .toast.visivel {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.erro {
            background: #c62828;
        }
    </style>
    <link rel="stylesheet" href="common.css">
</head>
<body>

<div id="toast" class="toast"></div>

<header class="topo">
   <div id="header">
        <div id="logo">
            <a href="index.html">
                <img src="imgs/Logo-cleo.png" alt="Logo Cleo" width="100px">
            </a>
        </div>
        <div class="barra-pesquisa">
            <input type="text" placeholder="Buscar produtos...">
            <img src="imgs/icone-loupe-gris 6.png" alt="Buscar" width="30px">
        </div>
        <div class="icones-header">
            <a href="login.html" class="icone-conta">
                <img src="imgs/logo-mulher-minha conta.png" alt="Minha Conta" width="35px">
                <div class="info-conta" id="info-conta">
                    <p class="email-usuario">Fazer Login</p>
                </div>
            </a>
            <a href="carrinho.html" class="icone-carrinho" style="position: relative;">
                <img src="imgs/carrinho 1.png" alt="Carrinho" width="35px"
                <p class="email-usuario">Carrinho</p>
            </a>
        </div>
   </div>
</header>

<nav class="menu">
    <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="#">Lançamentos</a></li>
        <li><a href="#">Roupas</a></li>
        <li><a href="#">Acessórios</a></li>
        <li><a href="#">Promoções</a></li>
    </ul>
</nav>

<div class="banner">
    <img src="imgs/lado-esquerdo.png" alt="Modelo Esquerda" class="banner-esquerda">
    <div class="banner-centro">
        <h2>Seu estilo único aqui!</h2>
        <div class="frete">
            <img src="imgs/Coracao (2).png" alt="coração" width="25px">
            <span>Frete Grátis em todo o Brasil</span>
            <img src="imgs/Coracao (2).png" alt="coração" width="25px">
        </div>
    </div>
    <img src="imgs/lado-direito.png" alt="Modelo Direita" class="banner-direita">
</div>

<div class="login-container">
    <h2>CADASTRE-SE JÁ E FIQUE POR DENTRO DE NOVIDADES!</h2>
    <form action="#" method="post" class="login-form">
        <input type="text"     id="nome"           name="nome"            placeholder="Nome Completo" required>
        <input type="email"    id="login"           name="login"           placeholder="Email" required>
        <input type="password" id="senha"           name="senha"           placeholder="Senha" required>
        <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Confirmar Senha" required>
        <button type="button" onclick="cadastrar()" class="cadastrar">Criar conta</button>
    </form>
</div>

<script src="carrinho.js"></script>
<script>
    function mostrarToast(msg, erro = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.toggle('erro', erro);
        toast.classList.add('visivel');
        setTimeout(() => toast.classList.remove('visivel'), 3500);
    }

    async function cadastrar() {
        const nome  = document.getElementById('nome').value.trim();
        const login = document.getElementById('login').value.trim();
        const senha = document.getElementById('senha').value.trim();
        const conf  = document.getElementById('confirmar-senha').value.trim();

        if (!nome || !login || !senha) {
            mostrarToast('Preencha todos os campos.', true);
            return;
        }
        if (senha !== conf) {
            mostrarToast('As senhas não coincidem.', true);
            return;
        }

        try {
            const resp = await fetch(`${API_BASE}/usuarios`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, login, senha, idPerfil: 4 })
            });

            if (resp.ok) {
    sessionStorage.setItem('contaCriada', '1');
    window.location.href = 'login.html';
} else if (resp.status === 409) {
    mostrarToast('Este e-mail já está cadastrado.', true);
} else {
    mostrarToast('Erro ao criar conta.', true);
}
        } catch (error) {
            console.error('Erro:', error);
            mostrarToast('Erro de conexão.', true);
        }
    }
</script>

<script src="gerente-sidebar.js"></script>
</body>
</html>
