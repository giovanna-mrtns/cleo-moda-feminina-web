<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleo Moda Feminina</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>

<div id="header">
    
    
    <div id="parte-superior">
        <div id="logo">
            <a href="navbar-1.html">
                <img src="imgs/Logo-cleo.png" alt="Logo Cleo" width="100px">
            </a>
        </div>
        <div class="div-busca">


            <input id="busca" placeholder="Buscar produtos..."> 
            <a class="nav-link" href="">Minha conta</a>
            <a class="nav-link" href="">Carrinho</a>
        </div>

    </div>

    
</div>

    <div class="div-nav">
        <a class="nav-link" href="">Início</a>
        <a class="nav-link" href="">Lançamentos</a>
        <a class="nav-link" href="">Roupas</a>
        <a class="nav-link" href="">Acessórios</a>
        <a class="nav-link" href="">Promoções</a>
    </div>

    <div id="hero">
        <h1>Seu estilo único aqui!</h1>

        <h4 id="frete-gratis">Frete grátis em todo o Brasil!</h4>

    </div>

</header>





<main>

    <section class="produtos">

        <div class="topo-produtos">
            <h2>TODOS OS PRODUTOS</h2>

            <select>
                <option>Ordenar por: Mais Recentes</option>
                <option>Menor preço</option>
                <option>Maior preço</option>
            </select>
        </div>

        <div class="cards-produtos">

            <div class="card">
                <img src="imgs/cropped-liso-branco.jpg" alt="cropped-liso-branco">
                <div class="info">
                    <p>Cropped Básico Branco</p>
                    <span>R$ 55,00</span>
                </div>
            </div>

            <div class="card">
                <img src="imgs/vestidoflorido.jpg" alt= "vestidoflorido">
                <div class="info">
                    <p>Vestido Florido</p>
                    <span>R$ 70,00</span>
                </div>
            </div>

            <div class="card">
                <img src="imgs/bolsadecouro.jpg" alt="bolsadecouro">
                <div class="info">
                    <p>Bolsa de Couro</p>
                    <span>R$ 350,00</span>
                </div>
            </div>

        </div>

    </section>

    <section class="categorias">

        <h2>MAIS VENDIDOS</h2>

        <div class="categorias-lista">

            <div class="categoria">
                <img src="imgs/bolsas.jpg" alt="Bolsas">
                <p>Bolsas</p>
            </div>

            <div class="categoria">
                <img src="imgs/blusas.jpg" alt="Blusas">
                <p>Blusas</p>
            </div>

            <div class="categoria">
                <img src="imgs/vestidos.jpg" alt="Vestidos">
                <p>Vestidos</p>
            </div>

            <div class="categoria">
                <img src="imgs/calças.jpg" alt="Calças">
                <p>Calças</p>
            </div>

        </div>

    </section>

</main>

</body>
</html>
